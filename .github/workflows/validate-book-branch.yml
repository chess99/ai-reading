name: Validate 运营之光 branch

on:
  push:
    branches:
      - book/yun-ying-zhi-guang

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: book/yun-ying-zhi-guang
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: .nextjs-site/package-lock.json

      - name: Install dependencies
        run: cd .nextjs-site && npm ci

      - name: Run relevant book tests
        run: cd .nextjs-site && node --test tests/book-taxonomy.test.mjs tests/weread-links.test.mjs

      - name: Build site
        run: cd .nextjs-site && npm run build

      - name: Check diff whitespace
        run: git diff --check origin/main...HEAD
