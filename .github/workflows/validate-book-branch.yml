name: Diagnose 运营之光 branch

on:
  push:
    branches:
      - book/yun-ying-zhi-guang

permissions:
  contents: write

jobs:
  diagnose:
    if: ${{ !contains(github.event.head_commit.message, '[validation-log]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: book/yun-ying-zhi-guang
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: .nextjs-site/package-lock.json

      - name: Install dependencies
        run: cd .nextjs-site && npm ci

      - name: Capture relevant test output
        run: |
          cd .nextjs-site
          set +e
          node --test tests/book-taxonomy.test.mjs tests/weread-links.test.mjs > ../validation-output.txt 2>&1
          echo "exit_code=$?" >> ../validation-output.txt
          exit 0

      - name: Commit diagnostic output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add validation-output.txt
          git commit -m "chore: capture validation output [validation-log]"
          git push origin HEAD:book/yun-ying-zhi-guang
