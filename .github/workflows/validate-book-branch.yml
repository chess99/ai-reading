name: Validate 运营之光 branch

on:
  push:
    branches:
      - book/yun-ying-zhi-guang

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: book/yun-ying-zhi-guang
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: .nextjs-site/package-lock.json

      - name: Install dependencies
        run: cd .nextjs-site && npm ci

      - name: Validate new book frontmatter and shelf
        run: |
          cd .nextjs-site
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import matter from 'gray-matter';
          const path = '../books/商业产品/市场增长/黄有璨-运营之光.md';
          const { data, content } = matter(fs.readFileSync(path, 'utf8'));
          assert.equal(data.slug, 'yun-ying-zhi-guang');
          assert.equal(data.title, '运营之光');
          assert.equal(data.author, '黄有璨');
          assert.ok(Array.isArray(data.tags));
          assert.equal(String(data.date), '2026-09-14');
          assert.match(content, /^\s*# 运营之光\s*$/m);
          NODE

      - name: Validate WeRead mapping
        run: cd .nextjs-site && node --test tests/weread-links.test.mjs

      - name: Build site
        run: cd .nextjs-site && npm run build

      - name: Check diff whitespace
        run: git diff --check origin/main...HEAD
