name: Populate WeRead link for 运营之光

on:
  push:
    branches:
      - book/yun-ying-zhi-guang

permissions:
  contents: write

jobs:
  populate:
    if: ${{ !contains(github.event.head_commit.message, '[skip weread]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: book/yun-ying-zhi-guang

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: .nextjs-site/package-lock.json

      - name: Install dependencies
        run: cd .nextjs-site && npm ci

      - name: Populate WeRead mapping
        run: cd .nextjs-site && npm run weread:fetch -- --slug=yun-ying-zhi-guang

      - name: Validate WeRead mapping
        run: cd .nextjs-site && node --test tests/weread-links.test.mjs

      - name: Commit mapping
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .nextjs-site/data/weread-links.json
          if git diff --cached --quiet; then
            echo "No WeRead mapping changes"
            exit 0
          fi
          git commit -m "chore: add WeRead link for 运营之光 [skip weread]"
          git push origin HEAD:book/yun-ying-zhi-guang
