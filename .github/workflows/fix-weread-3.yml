name: Fix WeRead 运营之光3.0

on:
  push:
    branches:
      - book/yun-ying-zhi-guang

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[skip-fix-weread-3]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: book/yun-ying-zhi-guang
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Update exact 3.0 mapping
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path = '.nextjs-site/data/weread-links.json';
          const links = JSON.parse(fs.readFileSync(path, 'utf8'));
          links['yun-ying-zhi-guang'] = {
            status: 'found',
            url: 'https://weread.qq.com/web/bookDetail/10532370813ab6e95g011c6a',
            checkedAt: '2026-09-14',
            note: '人工核验：《运营之光：我的互联网运营方法论与自白3.0》/ 黄有璨，完整书名与本次 EPUB 的 3.0 版本一致；EPUB ISBN 9787121434822'
          };
          fs.writeFileSync(path, JSON.stringify(links, null, 2) + '\n');
          NODE
      - name: Validate mapping
        run: cd .nextjs-site && node --test tests/weread-links.test.mjs
      - name: Commit mapping
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .nextjs-site/data/weread-links.json
          git commit -m "fix: point 运营之光 to WeRead 3.0 [skip-fix-weread-3]"
          git push origin HEAD:book/yun-ying-zhi-guang
