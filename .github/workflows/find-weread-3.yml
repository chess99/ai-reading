name: Find WeRead 运营之光3.0

on:
  push:
    branches:
      - book/yun-ying-zhi-guang

permissions:
  contents: write

jobs:
  find:
    if: ${{ !contains(github.event.head_commit.message, '[skip-find-weread]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: book/yun-ying-zhi-guang
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Query exact edition candidates
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const queries = ['运营之光3.0', '9787121434822', '运营之光3.0 黄有璨'];
          const decode = s => String(s || '').replace(/&amp;/g,'&').replace(/&quot;/g,'"').replace(/&#x27;/g,"'").replace(/&nbsp;/g,' ').replace(/<[^>]*>/g,'').replace(/\s+/g,' ').trim();
          const out = [];
          for (const query of queries) {
            const url = `https://weread.qq.com/web/search/books?keyword=${encodeURIComponent(query)}`;
            const r = await fetch(url, {headers:{'user-agent':'Mozilla/5.0 Chrome/126 Safari/537.36','accept-language':'zh-CN,zh;q=0.9'}});
            const html = await r.text();
            const items = html.match(/<li class="wr_bookList_item">[\s\S]*?<\/li>/g) || [];
            const candidates = items.map(item => {
              const title = item.match(/<p class="wr_bookList_item_title">([\s\S]*?)<\/p>/)?.[1];
              const author = item.match(/<p class="wr_bookList_item_author">([\s\S]*?)<\/p>/)?.[1];
              const href = item.match(/href="([^"]*(?:bookDetail|reader)[^"]*)"/)?.[1]?.replace(/&amp;/g,'&') || '';
              const id = item.match(/[?&]amp;ii=([^"&]+)/)?.[1] || item.match(/[?&]ii=([^"&]+)/)?.[1] || href.match(/\/(?:bookDetail|reader)\/([^?"/]+)/)?.[1] || '';
              return {title: decode(title), author: decode(author), href, id, url: id ? `https://weread.qq.com/web/bookDetail/${id}` : ''};
            }).filter(x => x.title);
            out.push({query, status:r.status, candidates});
          }
          fs.writeFileSync('weread-3-candidates.json', JSON.stringify(out, null, 2) + '\n');
          NODE
      - name: Commit candidates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add weread-3-candidates.json
          git commit -m "chore: inspect WeRead 3.0 candidates [skip-find-weread]"
          git push origin HEAD:book/yun-ying-zhi-guang
